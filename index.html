<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>movdice 接続実験</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
  #status { padding: 0.75rem; border-radius: 6px; margin: 1rem 0; }
  .status-none { background: #eee; }
  .status-connected { background: #d4edda; color: #155724; }
  .status-error { background: #f8d7da; color: #721c24; }
  button { padding: 0.5rem 1rem; margin-right: 0.5rem; }
  #log { font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; background: #f5f5f5; padding: 0.5rem; height: 200px; overflow-y: auto; }
</style>
</head>
<body>
<h1>movdice 接続実験</h1>
<p>ESP32との接続だけを試す実験用ページ。Chrome/Edgeでのみ動作します。</p>
<p>
  <a href="./about.html">このツールについて（概要・技術スタック）</a><br>
  <a href="./config.html">画像・プリセットの設定画面へ</a>
</p>

<div id="status" class="status-none">未接続</div>

<button id="connectBtn">ESP32に接続</button>
<button id="forgetBtn" disabled>アクセスを取り消す</button>

<h2>ログ <button id="copyLogBtn" style="font-size: 0.7rem; padding: 0.2rem 0.6rem;">コピー</button></h2>
<div id="log"></div>

<script type="module" src="./dist/index.js"></script>
</body>
</html>
