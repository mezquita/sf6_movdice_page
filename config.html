<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>movdice 設定（画像プレビュー実験）</title>
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  #status { padding: 0.75rem; border-radius: 6px; margin: 1rem 0; }
  .status-none { background: #eee; }
  .status-connected { background: #d4edda; color: #155724; }
  .status-error { background: #f8d7da; color: #721c24; }
  button { padding: 0.5rem 1rem; margin-right: 0.5rem; margin-bottom: 0.5rem; }
  #log { font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; background: #f5f5f5; padding: 0.5rem; height: 150px; overflow-y: auto; }
  #loadStatus { margin: 1rem 0; color: #555; }
  .set-section { margin: 1.5rem 0; }
  .set-section h3 { margin-bottom: 0.5rem; }
  .thumb-row { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .thumb { width: 110px; }
  .thumb img { width: 100%; border: 1px solid #ccc; border-radius: 4px; display: block; }
  .thumb .caption { font-size: 0.75rem; text-align: center; margin-top: 0.2rem; word-break: break-all; }
  .thumb .delBtn { width: 100%; font-size: 0.7rem; padding: 0.15rem 0; margin-top: 0.2rem; }
  #uploadBox, #debugBox, #poolBox { margin: 1rem 0; padding: 0.75rem; border: 1px dashed #ccc; border-radius: 6px; }
  #uploadBox input[type="text"] { width: 180px; }
  .usedBy { font-size: 0.7rem; color: #c0392b; text-align: center; margin-top: 0.2rem; }
  #storageInfo { margin: 1rem 0; padding: 0.6rem 0.75rem; background: #f5f5f5; border-radius: 6px; font-size: 0.85rem; }
  #storageBar { height: 8px; background: #ddd; border-radius: 4px; overflow: hidden; margin-top: 0.4rem; }
  #storageBarFill { height: 100%; background: #4a90d9; }
  #storageBarFill.warn { background: #e0a800; }
  #storageBarFill.danger { background: #d9534f; }
</style>
</head>
<body>
<p><a href="./index.html">&larr; 接続実験ページに戻る</a></p>
<h1>movdice 設定（画像プレビュー実験）</h1>
<p id="buildVersion" style="font-size: 0.75rem; color: #888;"></p>
<p>
  接続中のESP32から <code>images.json</code> と画像を読み出し、プリセットごとに一覧表示する実験ページ。<br>
  <strong>MicroPythonのRaw REPLを直接使う暫定実装</strong>で、本番の設定ツール用プロトコルとは別物。
</p>

<div id="status" class="status-none">未接続</div>

<button id="connectBtn">ESP32に接続</button>
<button id="forgetBtn" disabled>アクセスを取り消す</button>
<button id="loadBtn" disabled>画像一覧を読み込む（Raw REPL版・暫定）</button>
<button id="helloBtn" disabled>新プロトコルでhello（設定モードで実行してください）</button>
<button id="loadNewBtn" disabled>新プロトコルで画像一覧を読み込む（設定モードで実行してください）</button>
<button id="rebootBtn" disabled>設定を反映して再起動</button>

<div id="storageInfo"></div>

<div id="uploadBox">
  <strong>画像アップロード（新プロトコル）</strong><br>
  <input type="file" id="uploadFile" accept="image/png" disabled>
  <input type="text" id="uploadFilename" placeholder="ファイル名（省略時は元ファイル名から自動生成）" disabled>
  <button id="uploadBtn" disabled>アップロード</button>
</div>

<div id="loadStatus"></div>
<div id="sets"></div>

<div id="poolBox">
  <strong>画像プール管理</strong><br>
  <p style="font-size: 0.85rem; color: #555; margin: 0.3rem 0;">
    アップロード済みの全画像（どのプリセットからも独立した実体）。ここでの削除は<strong>実ファイルの完全削除</strong>で、
    使用中のプリセットにも影響します。
  </p>
  <button id="loadPoolBtn" disabled>プール一覧を読み込む</button>
  <div id="poolStatus"></div>
  <div id="poolList" class="thumb-row"></div>
</div>

<div id="debugBox">
  <strong>デバッグ: 任意サイズのダミーデータ送信テスト</strong><br>
  <input type="number" id="testSize" value="100" style="width: 100px;" disabled>
  <button id="testUploadBtn" disabled>テスト送信</button>
</div>

<h2>ログ <button id="copyLogBtn" style="font-size: 0.7rem; padding: 0.2rem 0.6rem;">コピー</button></h2>
<div id="log"></div>

<script type="module" src="./dist/config.js"></script>
</body>
</html>
